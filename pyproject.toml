[project]
name = "ci-pinpoint"
version = "0.1.0.dev0"
description = "Find the exact log lines that broke a CI build, explain why with verified line citations, and hand your coding agent a few-KB brief instead of a multi-MB log."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zeeshan Imdad" }]
requires-python = ">=3.11"
keywords = ["ci", "github-actions", "logs", "llm", "root-cause", "mcp", "devtools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
]

[project.urls]
Homepage = "https://github.com/xeeshan16/ci-pinpoint"
Issues = "https://github.com/xeeshan16/ci-pinpoint/issues"
Changelog = "https://github.com/xeeshan16/ci-pinpoint/blob/main/CHANGELOG.md"

[project.scripts]
ci-pinpoint = "ci_pinpoint.cli:main"

[dependency-groups]
dev = [
  "mcp>=1.9",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_pinpoint"]

[tool.hatch.build.targets.sdist]
include = ["src/ci_pinpoint", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT", "RET", "PL"]
ignore = [
  "PLR0913", # explicit keyword arguments are clearer than option bags here
  "PLR2004", # small literal thresholds are documented inline
  "S101",    # asserts are fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "PLC0415"]
"examples/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "live: talks to a real external service (skipped unless the matching env var is set)",
]

[tool.coverage.run]
source = ["ci_pinpoint"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
