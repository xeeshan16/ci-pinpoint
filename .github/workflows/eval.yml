name: eval

# On-demand evaluation on LogChunks (Zenodo, CC BY 4.0), optionally with a real
# local model on the runner's CPU: embedding re-ranking and/or diagnosis of a
# deterministic sample. The model-free eval also runs in ci.yml on every push.

on:
  workflow_dispatch:
    inputs:
      split:
        description: repository split (all, dev, test)
        default: all
      sample:
        description: deterministic sample of N logs from the split (0 = all)
        default: "0"
      embedder:
        description: none, or ollama to add the pinpoint+emb strategy
        default: none
      embed_model:
        description: Ollama embedding model
        default: nomic-embed-text
      rerank:
        description: add the pinpoint+llm strategy (blocks re-ranked by the Ollama chat model)
        type: boolean
        default: false
      diagnose:
        description: number of logs to diagnose with the model (0 = none)
        default: "0"
      model:
        description: Ollama chat model for diagnosis and re-ranking
        default: qwen2.5:3b

permissions:
  contents: read

jobs:
  logchunks:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CI_PINPOINT_TIMEOUT_S: "900"
      CI_PINPOINT_MAX_RETRIES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - uses: actions/cache@v4
        with:
          path: .data/logchunks
          key: logchunks-3632351-v1
      - name: install and start Ollama
        if: inputs.embedder == 'ollama' || inputs.diagnose != '0' || inputs.rerank
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          if ! curl -sf http://localhost:11434/api/tags > /dev/null; then
            nohup ollama serve > /tmp/ollama.log 2>&1 &
          fi
          for i in $(seq 1 60); do curl -sf http://localhost:11434/api/tags > /dev/null && break; sleep 1; done
          if [ "${{ inputs.embedder }}" = "ollama" ]; then ollama pull "${{ inputs.embed_model }}"; fi
          if [ "${{ inputs.diagnose }}" != "0" ] || [ "${{ inputs.rerank }}" = "true" ]; then
            ollama pull "${{ inputs.model }}"
          fi
      - name: evaluate
        run: |
          args=(--fetch --data .data/logchunks --split "${{ inputs.split }}" --out reports/eval -v)
          if [ "${{ inputs.embedder }}" = "ollama" ]; then
            args+=(--embedder ollama --embed-model "${{ inputs.embed_model }}")
          fi
          if [ "${{ inputs.diagnose }}" != "0" ] || [ "${{ inputs.rerank }}" = "true" ]; then
            args+=(--provider ollama --model "${{ inputs.model }}")
          fi
          if [ "${{ inputs.diagnose }}" != "0" ]; then args+=(--diagnose "${{ inputs.diagnose }}"); fi
          if [ "${{ inputs.rerank }}" = "true" ]; then args+=(--rerank --jobs 1); fi
          if [ "${{ inputs.sample }}" != "0" ]; then args+=(--sample "${{ inputs.sample }}"); fi
          uv run ci-pinpoint eval "${args[@]}"
          cat reports/eval/eval.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-logchunks
          path: reports/
