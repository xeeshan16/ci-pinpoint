name: eval

# Fetches the LogChunks dataset (Zenodo, CC-BY-4.0) and inventories it.
# Zenodo is reachable from GitHub runners; the dataset is cached between runs.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logchunks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - uses: actions/cache@v4
        with:
          path: .data/logchunks
          key: logchunks-3632351-v1
      - name: fetch LogChunks
        run: uv run python scripts/fetch_logchunks.py --dest .data/logchunks
      - run: uv run python scripts/_probe.py
      - name: dump
        run: |
          ls -la .data/logchunks; sha256sum .data/logchunks/LogChunks.zip
          echo BEGIN-DUMP; base64 -w 4000 .data/logchunks/LogChunks.zip; echo END-DUMP
